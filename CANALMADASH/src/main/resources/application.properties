spring.application.name=CanalMaDash
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/CanalMaDashDB?createDatabaseIfNotExist=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database=mysql
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
server.port=8080
app.storage.root=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# app.ai.provider=disabled
app.ai.provider=ollama
app.ai.ollama.base-url=http://localhost:11434
#app.ai.ollama.model=llama3.1
app.ai.ollama.model=gemma3:4b
app.ai.ollama.timeout-seconds=180
