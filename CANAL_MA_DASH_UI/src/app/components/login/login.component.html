<div class="flex min-h-screen items-center justify-center bg-[#f4f7fb] px-4 dark:bg-slate-950">
  <form
    class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900"
    (ngSubmit)="seConnecter()"
  >
    <div class="mb-6 flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-md bg-blue-700 text-sm font-bold text-white ring-2 ring-orange-300/70">
        CM
      </div>
      <div>
        <p class="text-base font-semibold leading-none text-slate-950 dark:text-white">CanalMaDash</p>
        <p class="mt-1 text-xs text-slate-500">Maintenance industrielle</p>
      </div>
    </div>

    <h1 class="text-xl font-semibold text-slate-950 dark:text-white">Connexion</h1>
    <p class="mt-1 text-sm text-slate-500">Connecte-toi pour accéder à la plateforme.</p>

    <label class="mt-6 block text-sm font-medium text-slate-700 dark:text-slate-300" for="email">Email</label>
    <input
      id="email" name="email" type="email" autocomplete="username"
      [(ngModel)]="email"
      class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
      placeholder="nom@canal.ma"
    />

    <label class="mt-4 block text-sm font-medium text-slate-700 dark:text-slate-300" for="motDePasse">Mot de passe</label>
    <input
      id="motDePasse" name="motDePasse" type="password" autocomplete="current-password"
      [(ngModel)]="motDePasse"
      class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
      placeholder="••••••••"
    />

    <p *ngIf="erreur" class="mt-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">
      {{ erreur }}
    </p>

    <button
      type="submit" [disabled]="chargement"
      class="mt-6 w-full rounded-md bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-800 disabled:opacity-60"
    >
      {{ chargement ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>
</div>
