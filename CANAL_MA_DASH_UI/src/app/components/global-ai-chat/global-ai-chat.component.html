<div class="fixed bottom-5 right-5 z-50">
  <section
    *ngIf="open"
    class="mb-3 flex h-[560px] w-[min(420px,calc(100vw-2rem))] flex-col overflow-hidden rounded-lg border border-blue-100 bg-white shadow-xl shadow-blue-900/20 dark:border-slate-800 dark:bg-slate-900"
  >
    <div class="flex items-start justify-between gap-3 border-b border-blue-100 bg-blue-700 px-4 py-3 text-white">
      <div>
        <p class="text-sm font-bold">Assistant IA CanalMaDash</p>
        <p class="mt-1 text-xs text-blue-100">Application, machines, pieces, demandes et interventions</p>
      </div>
      <button type="button" class="rounded-md px-2 py-1 text-sm font-bold hover:bg-blue-600" (click)="toggle()">X</button>
    </div>

    <div class="flex-1 space-y-3 overflow-y-auto bg-slate-50 p-4 dark:bg-slate-950">
      <div
        *ngFor="let message of messages"
        class="flex"
        [class.justify-end]="message.role === 'USER'"
        [class.justify-start]="message.role === 'AI'"
      >
        <div
          class="max-w-[88%] rounded-lg px-4 py-3 text-sm leading-6"
          [class.bg-orange-600]="message.role === 'USER'"
          [class.text-white]="message.role === 'USER'"
          [class.bg-white]="message.role === 'AI'"
          [class.text-slate-800]="message.role === 'AI'"
          [class.border]="message.role === 'AI'"
          [class.border-blue-100]="message.role === 'AI'"
        >
          <div *ngIf="message.sections?.length; else rawGlobalMessage" class="space-y-3">
            <div *ngFor="let section of message.sections">
              <p class="font-bold text-blue-900">{{ section.title }}</p>
              <p class="mt-1 whitespace-pre-line">{{ section.content }}</p>
            </div>
          </div>
          <ng-template #rawGlobalMessage>
            <p class="whitespace-pre-line">{{ message.content }}</p>
          </ng-template>
        </div>
      </div>
      <div *ngIf="loading" class="rounded-md bg-orange-50 px-3 py-2 text-sm font-semibold text-orange-700">
        L assistant consulte les donnees...
      </div>
    </div>

    <form class="border-t border-blue-100 bg-white p-3 dark:border-slate-800 dark:bg-slate-900" (ngSubmit)="send()">
      <div class="flex gap-2">
        <input
          class="form-control"
          name="globalAiInput"
          [(ngModel)]="input"
          [disabled]="loading"
          placeholder="Ex: quelles machines ont le plus de pannes ?"
        />
        <button type="submit" class="primary-action shrink-0" [disabled]="loading || !input.trim()">Envoyer</button>
      </div>
      <div class="mt-2 flex flex-wrap gap-2 text-xs">
        <button type="button" class="rounded-md bg-blue-50 px-2 py-1 font-semibold text-blue-700" (click)="input='Comment utiliser le Kanban maintenance ?'">Kanban</button>
        <button type="button" class="rounded-md bg-blue-50 px-2 py-1 font-semibold text-blue-700" (click)="input='Quelles pieces sont en alerte stock ?'">Stock</button>
        <button type="button" class="rounded-md bg-blue-50 px-2 py-1 font-semibold text-blue-700" (click)="input='Quelles machines sont les plus critiques ?'">Machines critiques</button>
      </div>
    </form>
  </section>

  <button
    type="button"
    class="flex items-center gap-2 rounded-full bg-orange-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-orange-900/25 hover:bg-orange-700"
    (click)="toggle()"
  >
    <span class="flex h-7 w-7 items-center justify-center rounded-full bg-white/20">IA</span>
    Assistant IA
  </button>
</div>
