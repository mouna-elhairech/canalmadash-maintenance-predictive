<ion-content fullscreen>
  <div class="mobile-page">
    <div class="mx-auto flex min-h-[calc(100vh-2.5rem)] w-full max-w-md flex-col justify-between">
      <div>
        <header class="mobile-topbar">
          <div class="flex items-center gap-3">
            <div class="mobile-icon bg-blue-700 text-white ring-2 ring-orange-300/70">
              <ion-icon name="construct-outline"></ion-icon>
            </div>
            <div>
              <p class="text-lg font-bold leading-none text-slate-950">CanalMaDash</p>
              <p class="mt-1 text-xs text-slate-500">Application maintenance</p>
            </div>
          </div>
          <div class="mt-6">
            <p class="text-xs font-semibold uppercase text-blue-700">Connexion rapide</p>
            <h1 class="mt-2 text-2xl font-bold text-slate-950">Choisir le profil</h1>
          </div>
        </header>

        <div class="mt-5 space-y-3">
          <button
            type="button"
            (click)="choisirOperateur()"
            class="mobile-card w-full text-left active:scale-[0.99]"
          >
            <div class="flex items-start justify-between gap-4">
              <div class="flex items-start gap-3">
                <span class="mobile-icon">
                  <ion-icon name="speedometer-outline"></ion-icon>
                </span>
                <div>
                <p class="text-base font-bold text-slate-950">Operateur</p>
                <p class="mt-2 text-sm leading-5 text-slate-600">Etats machines et demandes.</p>
                </div>
              </div>
              <span class="rounded-md bg-blue-50 px-2.5 py-1 text-xs font-semibold text-blue-700">Terrain</span>
            </div>
          </button>

          <button
            type="button"
            (click)="choisirMaintenance()"
            class="mobile-card w-full text-left active:scale-[0.99]"
          >
            <div class="flex items-start justify-between gap-4">
              <div class="flex items-start gap-3">
                <span class="mobile-icon mobile-icon-orange">
                  <ion-icon name="build-outline"></ion-icon>
                </span>
                <div>
                <p class="text-base font-bold text-slate-950">Maintenance</p>
                <p class="mt-2 text-sm leading-5 text-slate-600">Planning, interventions et indicateurs.</p>
                </div>
              </div>
              <span class="rounded-md bg-orange-50 px-2.5 py-1 text-xs font-semibold text-orange-700">Suivi</span>
            </div>
          </button>
        </div>
      </div>

      <p class="pt-8 text-center text-xs text-slate-500">
        Synchronise avec le backend CanalMaDash.
      </p>
    </div>
  </div>
</ion-content>
